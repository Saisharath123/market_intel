# Community Build analyzes main only; its blocking quality gate precedes release builds.
# CI connects to the private AWS server through SSM. Store SONAR_TOKEN as a secret.
# Native PR Sonar analysis needs a paid edition. SONAR_ENABLED cannot bypass main.
sonar.projectKey=market-intel
sonar.projectName=Market Intel
sonar.sources=market,app.py
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/__pycache__/**,**/.venv/**

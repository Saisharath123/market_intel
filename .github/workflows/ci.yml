name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_MODE: demo
      NEWS_MODE: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=market --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Save main-branch coverage for the mandatory Sonar gate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage-${{ github.run_id }}
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Explain Community Build branch support
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          echo 'SonarQube Community Build analyzes main only. PRs receive lint, tests, secret scanning and container checks without AWS or Sonar credentials. The main-branch Sonar gate is mandatory before release; native PR Sonar analysis requires a paid edition.' >> "$GITHUB_STEP_SUMMARY"
  sonar:
    name: Mandatory main-branch Sonar quality gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [secrets, python]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      SONAR_HOST_URL: http://127.0.0.1:9000
      SONAR_SSM_INSTANCE_ID: ${{ vars.SONAR_SSM_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Require the mandatory Sonar connection
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_TUNNEL_ROLE_ARN: ${{ vars.SONAR_TUNNEL_ROLE_ARN }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_TUNNEL_ROLE_ARN" ] || [ -z "$SONAR_SSM_INSTANCE_ID" ]; then
            echo '::error::SonarQube is mandatory on main. Complete the private AWS SonarQube setup, configure repository variables SONAR_TUNNEL_ROLE_ARN and SONAR_SSM_INSTANCE_ID, and set secret SONAR_TOKEN for project market-intel. Main-branch container builds and releases remain blocked until this gate passes.'
            echo 'The required AWS SonarQube connection is missing. Complete docs/SONARQUBE.md and configure SONAR_TUNNEL_ROLE_ARN, SONAR_SSM_INSTANCE_ID and secret SONAR_TOKEN. SONAR_ENABLED cannot bypass this gate.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-coverage-${{ github.run_id }}
      - name: Federate for the private SonarQube tunnel only
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.SONAR_TUNNEL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '521595303406'
          role-session-name: market-intel-sonar-${{ github.run_id }}
          retry-max-attempts: 2
      - name: Connect the private SonarQube server over SSM
        run: |
          python infra/sonarqube-tunnel.py install-plugin
          python infra/sonarqube-tunnel.py start
      - name: Sonar analysis and blocking quality gate
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Close the private SonarQube tunnel
        if: always()
        run: python infra/sonarqube-tunnel.py stop
  containers:
    name: Three image security and contract checks
    needs: [secrets, python, sonar]
    if: >-
      always() && !cancelled() && needs.secrets.result == 'success' && needs.python.result == 'success' &&
      (needs.sonar.result == 'success' || ((github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && needs.sonar.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MARKET_MODE: demo
      NEWS_MODE: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/verify-images
      - name: Retain vulnerability reports and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/image-reports/
          retention-days: 7
          if-no-files-found: ignore
  manifests:
    name: Staging and production manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install 'PyYAML>=6,<7'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.19.0
      - name: Render both environments with representative immutable images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          digest="sha256:$(printf 'a%.0s' {1..64})"
          for environment in staging production; do
            namespace=market-intel
            if [ "$environment" = staging ]; then namespace=market-intel-staging; fi
            args=(--namespace "$namespace" -f deploy/chart/values.yaml -f "deploy/chart/values-$environment.yaml")
            for pair in dashboard:dashboard market-api:market news-api:news; do
              args+=(--set-string "services.${pair%%:*}.image=521595303406.dkr.ecr.ap-south-1.amazonaws.com/market-intel/${pair##*:}@$digest")
            done
            helm lint deploy/chart "${args[@]}"
            helm template market-intel deploy/chart --kube-version 1.36.0 "${args[@]}" > "work/chart-$environment.yaml"
          done
      - name: Prove canary queries reject failed or missing traffic
        run: |
          python deploy/rollouts/check-analysis.py work/chart-production.yaml work/promql-tests.yaml
          docker run --rm --entrypoint /bin/promtool -v "$PWD:/workspace" -w /workspace quay.io/prometheus/prometheus:v3.15.1 test rules work/promql-tests.yaml
  quality-gate:
    name: Quality gate
    if: always()
    needs: [secrets, python, sonar, containers, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory check
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          MANIFESTS_RESULT: ${{ needs.manifests.result }}
        run: |
          test "$SECRETS_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$CONTAINERS_RESULT" = success
          test "$MANIFESTS_RESULT" = success
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            test "$SONAR_RESULT" = success
          else
            test "$SONAR_RESULT" = skipped
          fi

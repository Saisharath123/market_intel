name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_MODE: demo
      NEWS_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: docker build -t india-market-pulse:test .
      - name: Verify each microservice image
        run: |
          for service in dashboard market news; do
            docker build -f services/$service/Dockerfile -t market-intel-$service:test .
          done
      - name: Validate EC2 monitoring Compose configuration
        run: docker compose -f compose.yaml -f deploy/ec2/compose.yaml config --quiet
      - name: Start and smoke-test microservices
        run: |
          docker compose up --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8000/api/v1/quotes
          curl --fail http://127.0.0.1:8001/api/v1/news
          curl --fail http://127.0.0.1:8501/_stcore/health
      - name: Stop smoke-test services
        if: always()
        run: docker compose down
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Validate Kubernetes chart
        run: |
          helm lint deploy/chart --set services.dashboard.image=example/dashboard:ci --set services.market-api.image=example/market:ci --set services.news-api.image=example/news:ci
          helm template market-intel deploy/chart --kube-version 1.36.0 --set services.dashboard.image=example/dashboard:ci --set services.market-api.image=example/market:ci --set services.news-api.image=example/news:ci > /tmp/market-intel-rendered.yaml

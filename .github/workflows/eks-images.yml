name: Build EKS release images
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the tested image set and create a staging release PR.
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - app.py
      - market/**
      - services/**
      - requirements*.txt
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - sonar-project.properties
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/ci.yml
      - .github/workflows/eks-images.yml
permissions:
  contents: read
concurrency:
  group: market-intel-image-release
  cancel-in-progress: false
jobs:
  validation:
    if: github.ref == 'refs/heads/main' && vars.EKS_RELEASE_ENABLED == 'true' && (github.event_name == 'push' || inputs.confirm_publish == true)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      MARKET_MODE: demo
      NEWS_MODE: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install 'PyYAML>=6,<7'
      - name: Federate using the repository-scoped publisher role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.EKS_IMAGE_ROLE_ARN || 'arn:aws:iam::521595303406:role/market-intel-github-publisher' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '521595303406'
          role-session-name: market-intel-ci-${{ github.run_id }}
          retry-max-attempts: 2
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr
      - name: Reuse already published immutable artifacts on reruns
        id: existing
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REGISTRY" = "521595303406.dkr.ecr.$AWS_REGION.amazonaws.com"
          for service in dashboard market news; do
            digest=$(aws ecr batch-get-image --repository-name "market-intel/$service" --image-ids "imageTag=$GITHUB_SHA" --query 'images[0].imageId.imageDigest' --output text)
            if [ "$digest" = None ]; then
              echo "$service=false" >> "$GITHUB_OUTPUT"
            else
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              docker pull "$REGISTRY/market-intel/$service@$digest"
              docker tag "$REGISTRY/market-intel/$service@$digest" "market-intel-$service:test"
              echo "$service=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Build, scan and contract-test the exact release artifacts
        uses: ./.github/actions/verify-images
        with:
          skip-dashboard: ${{ steps.existing.outputs.dashboard }}
          skip-market: ${{ steps.existing.outputs.market }}
          skip-news: ${{ steps.existing.outputs.news }}
      - uses: ./.github/actions/setup-aws-notation
        id: notation
      - name: Publish those same artifacts and require completed ECR scans
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          EXISTING_DASHBOARD: ${{ steps.existing.outputs.dashboard }}
          EXISTING_MARKET: ${{ steps.existing.outputs.market }}
          EXISTING_NEWS: ${{ steps.existing.outputs.news }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          printf 'services:\n' > work/release-values.yaml
          for service in dashboard market news; do
            key="EXISTING_${service^^}"
            image="$REGISTRY/market-intel/$service"
            if [ "${!key}" != true ]; then
              docker tag "market-intel-$service:test" "$image:$GITHUB_SHA"
              docker push "$image:$GITHUB_SHA"
            fi
            digest=$(aws ecr describe-images --repository-name "market-intel/$service" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            python infra/check-image-scan.py "market-intel/$service" "$digest"
            name="$service"
            if [ "$service" != dashboard ]; then name="$service-api"; fi
            printf '  %s:\n    image: "%s@%s"\n' "$name" "$image" "$digest" >> work/release-values.yaml
          done
          python .github/scripts/gitops_release.py manifest --source work/release-values.yaml --region "$AWS_REGION"
      - name: Record private build provenance and verify signature revocation status
        env:
          NOTATION: ${{ steps.notation.outputs.notation }}
          NOTATION_LIBEXEC_PATH: ${{ steps.notation.outputs.libexec }}
          NOTATION_ROOT_CERT: ${{ steps.notation.outputs.root-cert }}
          EXISTING_DASHBOARD: ${{ steps.existing.outputs.dashboard }}
          EXISTING_MARKET_API: ${{ steps.existing.outputs.market }}
          EXISTING_NEWS_API: ${{ steps.existing.outputs.news }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          newly_built=()
          for service in dashboard market-api news-api; do
            key="EXISTING_${service^^}"
            key="${key//-/_}"
            case "${!key}" in
              false) newly_built+=(--sign-new-service "$service") ;;
              true) ;;
              *) exit 1 ;;
            esac
          done
          python infra/release_provenance.py record --account 521595303406 --region "$AWS_REGION" \
            --profile MarketIntelReleaseSigning --source work/release-values.yaml --notation "$NOTATION" \
            --notation-libexec "$NOTATION_LIBEXEC_PATH" --root-cert "$NOTATION_ROOT_CERT" "${newly_built[@]}"
      - name: Propose staging GitOps release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VALUES: work/release-values.yaml
        run: bash .github/scripts/propose-release.sh staging
      - name: Retain release vulnerability reports and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/image-reports/
          retention-days: 7
          if-no-files-found: ignore

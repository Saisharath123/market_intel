name: Promote staging to production
on:
  workflow_dispatch:
    inputs:
      staging_verified:
        description: I checked Argo staging is Synced/Healthy and its PostSync smoke hook passed for the current staged digests.
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: market-intel-production-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main' && vars.EKS_RELEASE_ENABLED == 'true' && inputs.staging_verified == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install 'PyYAML>=6,<7'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.EKS_IMAGE_ROLE_ARN || 'arn:aws:iam::521595303406:role/market-intel-github-publisher' }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '521595303406'
          role-session-name: market-intel-promote-${{ github.run_id }}
          retry-max-attempts: 2
      - name: Revalidate the published staged digests without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/gitops_release.py manifest --source deploy/chart/values-staging.yaml --region "$AWS_REGION" > "$RUNNER_TEMP/staged-images.txt"
          while IFS='|' read -r service repository digest; do
            existing=$(aws ecr batch-get-image --repository-name "$repository" --image-ids "imageDigest=$digest" --query 'images[0].imageId.imageDigest' --output text)
            test "$existing" = "$digest"
            python infra/check-image-scan.py "$repository" "$digest"
          done < "$RUNNER_TEMP/staged-images.txt"
      - name: Create the reviewed production promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VALUES: deploy/chart/values-staging.yaml
        run: bash .github/scripts/propose-release.sh production

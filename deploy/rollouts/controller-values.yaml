# Verified against argo/argo-rollouts chart 2.43.8, application v1.10.1.
# CloudFormation associates this service account through EKS Pod Identity.
# No IRSA role annotation or static AWS credential is required.
controller:
  replicas: 1
  awsVerifyTargetGroup: true
  # v1.10.1 uses the AWS SDK region environment; --aws-region is not a flag.
  # EKS Pod Identity injects AWS_REGION/AWS_DEFAULT_REGION in this cluster.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
serviceAccount:
  create: true
  name: argo-rollouts
dashboard:
  enabled: false
providerRBAC:
  enabled: true
  providers:
    istio: false
    smi: false
    ambassador: false
    awsLoadBalancerController: true
    awsAppMesh: false
    traefik: false
    apisix: false
    contour: false
    glooPlatform: false
    gatewayAPI: false

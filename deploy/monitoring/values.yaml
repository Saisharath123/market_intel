# kube-prometheus-stack 92.11.0. Private services, accessed through kubectl port-forward.
# Install as release "monitoring" in namespace "monitoring". Do not expose these UIs publicly.
grafana:
  # Bootstrap generates/reuses this in-cluster Secret; no known default password.
  adminPassword: ''
  admin:
    existingSecret: market-intel-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: market-intel-gp3
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
    security:
      # Local port-forward uses HTTP. Enable secure cookies when adding an HTTPS ingress.
      cookie_secure: false
      cookie_samesite: lax
    server:
      root_url: http://localhost:3000
  sidecar:
    dashboards:
      searchNamespace: monitoring
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 15GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [market-intel, market-intel-staging, monitoring, kube-system, argo-rollouts]
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: '1', memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: market-intel-gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 20Gi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: market-intel-gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 2Gi}
# EKS managed control-plane endpoints are not exposed for these scrapers.
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
prometheusOperator:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}

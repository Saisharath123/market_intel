{{- range $name, $service := .Values.services }}
{{- if not (and $.Values.rollouts.enabled (eq $name "market-api")) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- include "market-intel.podSpec" (dict "name" $name "service" $service "root" $) | nindent 6 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- if or (not $.Values.rollouts.enabled) (ne $name "market-api") }}
    metrics-scrape: 'true'
    {{- end }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    {{- include "market-intel.servicePorts" (dict "name" $name "root" $) | nindent 4 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  {{- if gt (int $service.replicas) 1 }}
  minAvailable: 1
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}

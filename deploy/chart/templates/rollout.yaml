{{- if .Values.rollouts.enabled }}
{{- if not .Values.monitoring.enabled }}
{{- fail "rollouts.enabled requires monitoring.enabled: true" }}
{{- end }}
{{- $service := index .Values.services "market-api" }}
{{- $phase := include "market-intel.productionTlsPhase" . }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: market-api
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 900
  progressDeadlineAbort: true
  minReadySeconds: 10
  analysis:
    successfulRunHistoryLimit: 5
    unsuccessfulRunHistoryLimit: 5
  selector:
    matchLabels:
      app: market-api
  template:
    metadata:
      {{- if .Values.rollouts.abortDrillId }}
      {{- if ne .Values.environment "production" }}
      {{- fail "rollouts.abortDrillId is supported only in the production portfolio lab" }}
      {{- end }}
      annotations:
        market-intel/abort-drill: {{ .Values.rollouts.abortDrillId | quote }}
      {{- end }}
      labels:
        app: market-api
    spec:
      {{- include "market-intel.podSpec" (dict "name" "market-api" "service" $service "root" .) | nindent 6 }}
  strategy:
    canary:
      stableService: market-api
      canaryService: market-api-canary
      maxSurge: 1
      maxUnavailable: 0
      scaleDownDelaySeconds: 60
      abortScaleDownDelaySeconds: 60
      trafficRouting:
        alb:
          ingress: market-api-canary
          rootService: market-api-root
          servicePort: {{ ternary 8443 $service.port (or (eq $phase "switch") (eq $phase "retire")) }}
      steps:
        - setWeight: 10
        - pause:
            duration: {{ .Values.rollouts.warmupSeconds }}s
        - analysis:
            templates:
              - templateName: market-api-canary-quality
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause:
            duration: {{ .Values.rollouts.warmupSeconds }}s
        - analysis:
            templates:
              - templateName: market-api-canary-quality
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 100
        - pause:
            duration: {{ .Values.rollouts.warmupSeconds }}s
        - analysis:
            templates:
              - templateName: market-api-canary-quality
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
---
apiVersion: v1
kind: Service
metadata:
  name: market-api-canary
  labels:
    app: market-api
spec:
  selector:
    app: market-api
  ports:
    {{- include "market-intel.servicePorts" (dict "name" "market-api" "root" .) | nindent 4 }}
---
# Scrape each revision pod once, rather than stable/canary Services separately.
apiVersion: v1
kind: Service
metadata:
  name: market-api-metrics
  labels:
    app: market-api
    metrics-scrape: 'true'
spec:
  selector:
    app: market-api
  ports:
    {{- include "market-intel.servicePorts" (dict "name" "market-api" "root" .) | nindent 4 }}
{{- end }}

{{- if .Values.monitoring.enabled }}
{{- $phase := include "market-intel.productionTlsPhase" . }}
{{- $productionHttps := or (eq $phase "switch") (eq $phase "retire") }}
{{- $tls := or (default (dict) .Values.internalTls).enabled $productionHttps }}
{{- $newsMtls := include "market-intel.newsMtlsMode" . }}
{{- range $name := list "market-api" "news-api" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: market-intel
spec:
  selector:
    matchLabels:
      app: {{ $name }}
      metrics-scrape: "true"
  podTargetLabels:
    - rollouts-pod-template-hash
  endpoints:
    - port: {{ ternary "https" "http" $productionHttps }}
      path: /metrics
      interval: 30s
      honorLabels: true
      {{- if $tls }}
      scheme: https
      tlsConfig:
        ca:
          configMap:
            name: market-intel-ca
            key: ca.crt
        serverName: {{ include "market-intel.apiDns" (dict "name" $name "root" $) | quote }}
        {{- if and $newsMtls (eq $name "news-api") }}
        cert:
          secret:
            name: prometheus-news-client-tls
            key: tls.crt
        keySecret:
          name: prometheus-news-client-tls
          key: tls.key
        {{- end }}
      {{- end }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: market-intel
  labels:
    app.kubernetes.io/part-of: market-intel
spec:
  groups:
    - name: market-intel-{{ .Release.Namespace }}
      rules:
        - alert: MarketIntelServiceDown
          expr: up{namespace={{ .Release.Namespace | quote }},job=~"market-api.*|news-api.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A Market Intel API scrape target is down
        - alert: MarketIntelHighErrorRate
          expr: sum by (namespace, service) (rate(market_intel_http_requests_total{namespace={{ .Release.Namespace | quote }},status=~"5.."}[5m])) / clamp_min(sum by (namespace, service) (rate(market_intel_http_requests_total{namespace={{ .Release.Namespace | quote }}}[5m])), 0.001) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Market Intel API error rate exceeds five percent
{{- end }}

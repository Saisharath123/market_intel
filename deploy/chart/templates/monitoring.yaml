{{- if .Values.monitoring.enabled }}
{{- range $name := list "market-api" "news-api" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: market-intel
spec:
  selector:
    matchLabels:
      app: {{ $name }}
      metrics-scrape: "true"
  podTargetLabels:
    - rollouts-pod-template-hash
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      honorLabels: true
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: market-intel
  labels:
    app.kubernetes.io/part-of: market-intel
spec:
  groups:
    - name: market-intel-{{ .Release.Namespace }}
      rules:
        - alert: MarketIntelServiceDown
          expr: up{namespace={{ .Release.Namespace | quote }},job=~"market-api.*|news-api.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A Market Intel API scrape target is down
        - alert: MarketIntelHighErrorRate
          expr: sum by (namespace, service) (rate(market_intel_http_requests_total{namespace={{ .Release.Namespace | quote }},status=~"5.."}[5m])) / clamp_min(sum by (namespace, service) (rate(market_intel_http_requests_total{namespace={{ .Release.Namespace | quote }}}[5m])), 0.001) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Market Intel API error rate exceeds five percent
{{- end }}

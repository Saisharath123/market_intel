{{- if .Values.smokeTest.enabled }}
{{- $phase := include "market-intel.productionTlsPhase" . }}
{{- $warm := eq $phase "prepare" }}
{{- $tls := or (default (dict) .Values.internalTls).enabled (eq $phase "switch") (eq $phase "retire") }}
{{- $newsMtls := include "market-intel.newsMtlsMode" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-intel-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  smoke.py: |
{{ .Files.Get "files/smoke.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: market-intel-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.smokeTest.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: market-intel-smoke
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        {{- if $newsMtls }}
        fsGroup: 10001
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: {{ required "Approve the market API image before enabling the smoke hook" (index .Values.services "market-api").image | quote }}
          command: [python, /checks/smoke.py]
          args:
            - --attempts
            - {{ .Values.smokeTest.attempts | quote }}
            - --market-traffic-url
            - {{ include "market-intel.marketTrafficUrl" . | quote }}
            - --market-mode
            - {{ (index .Values.services "market-api").env.MARKET_MODE | quote }}
            - --news-mode
            - {{ (index .Values.services "news-api").env.NEWS_MODE | quote }}
            {{- if $tls }}
            - --market-url
            - {{ include "market-intel.internalApiUrl" (dict "name" "market-api" "root" .) | quote }}
            - --news-url
            - {{ include "market-intel.internalApiUrl" (dict "name" "news-api" "root" .) | quote }}
            {{- end }}
            {{- if $warm }}
            - --warm-tls-endpoint
            - {{ include "market-intel.internalApiUrl" (dict "name" "market-api" "root" .) | quote }}
            - market
            - --warm-tls-endpoint
            - {{ include "market-intel.internalApiUrl" (dict "name" "news-api" "root" .) | quote }}
            - news
            {{- end }}
            {{- if or $tls $warm }}
            - --tls-ca-file
            - /var/run/market-intel/ca/ca.crt
            {{- end }}
            {{- if $newsMtls }}
            - --news-client-cert
            - /var/run/market-intel/news-client/tls.crt
            - --news-client-key
            - /var/run/market-intel/news-client/tls.key
            {{- end }}
            {{- if eq .Values.environment "staging" }}
            - --expect-demo
            {{- end }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: checks
              mountPath: /checks
              readOnly: true
            {{- if or $tls $warm }}
            - name: internal-ca
              mountPath: /var/run/market-intel/ca
              readOnly: true
            {{- end }}
            {{- if $newsMtls }}
            - name: news-client
              mountPath: /var/run/market-intel/news-client
              readOnly: true
            {{- end }}
      volumes:
        - name: checks
          configMap:
            name: market-intel-smoke
        {{- if or $tls $warm }}
        - name: internal-ca
          configMap:
            name: market-intel-ca
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if $newsMtls }}
        - name: news-client
          secret:
            secretName: smoke-news-client-tls
            defaultMode: 288
        {{- end }}
{{- end }}

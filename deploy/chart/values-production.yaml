services:
  dashboard:
    image: '' # Filled only by an approved production promotion PR.
  market-api:
    image: '' # Filled only by an approved production promotion PR.
  news-api:
    image: '' # Filled only by an approved production promotion PR.
monitoring:
  enabled: true

environment: production
requireImageDigest: true
smokeTest:
  enabled: true
  # Initial ALB provisioning/private DNS propagation may overlap the PostSync hook.
  attempts: 60
  activeDeadlineSeconds: 600
rollouts:
  enabled: true
  routeDashboardThroughAlb: true
  # Bootstrap maintains the private CNAME to the weighted ALB ingress.
  apiHostname: api.market-intel.internal

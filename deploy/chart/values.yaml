services:
  dashboard:
    port: 8501
    replicas: 2
    image: ''
    healthPath: /_stcore/health
    memory: 512Mi
    env:
      MARKET_API_URL: http://market-api:8000
      NEWS_API_URL: http://news-api:8000
  market-api:
    port: 8000
    replicas: 2
    image: ''
    healthPath: /health
    memory: 768Mi
    env:
      MARKET_MODE: yahoo
  news-api:
    port: 8000
    replicas: 2
    image: ''
    healthPath: /health
    memory: 256Mi
    env:
      NEWS_MODE: cnbctv18
ingress:
  enabled: false
  certificateArn: ''
  host: ''
monitoring:
  enabled: false

# CI may render test tags. Staging and production must pin sha256 digests.
environment: local
requireImageDigest: false
smokeTest:
  enabled: false
rollouts:
  enabled: false
  prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  warmupSeconds: 120
  minimumRequests: 20
  maximumErrorRatio: 0.01
  maximumP95Seconds: 2

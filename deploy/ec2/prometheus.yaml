global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: market-intel
    static_configs:
      - targets: [market-api:8000]
        labels: {service: market}
      - targets: [news-api:8000]
        labels: {service: news}
  - job_name: ec2
    static_configs:
      - targets: [host.docker.internal:9100]
  - job_name: http-health
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: [http://dashboard:8501/_stcore/health, http://market-api:8000/health, http://news-api:8000/health, http://grafana:3000/api/health]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox:9115'}
